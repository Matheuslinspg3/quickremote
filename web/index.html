<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRemote - Acesso Remoto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status.error {
            background: #fee;
            color: #c33;
            display: block;
        }

        .status.success {
            background: #efe;
            color: #3c3;
            display: block;
        }

        .status.info {
            background: #eef;
            color: #33c;
            display: block;
        }

        #viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            z-index: 1000;
        }

        #viewer.active {
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .viewer-info {
            font-size: 14px;
        }

        .viewer-controls button {
            background: #667eea;
            padding: 8px 16px;
            margin-left: 10px;
            border-radius: 6px;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #screen {
            max-width: 100%;
            max-height: 100%;
            border: 2px solid #667eea;
            cursor: crosshair;
        }

        .stats {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <div class="logo">
            <h1>🚀 QuickRemote</h1>
            <p>Acesso remoto rápido e seguro</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="hostId">ID do Computador</label>
                <input 
                    type="text" 
                    id="hostId" 
                    placeholder="Ex: A3F2B8C1" 
                    required 
                    maxlength="8"
                    style="text-transform: uppercase;"
                />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Digite a senha (opcional)"
                />
            </div>

            <button type="submit" id="connectBtn">
                Conectar
            </button>

            <div class="status" id="status"></div>
        </form>
    </div>

    <div id="viewer">
        <div class="viewer-header">
            <div class="viewer-info">
                <strong>Conectado a: <span id="connectedHost"></span></strong>
            </div>
            <div class="viewer-controls">
                <button onclick="toggleFullscreen()">Tela Cheia</button>
                <button onclick="disconnect()">Desconectar</button>
            </div>
        </div>
        
        <div class="stats" id="stats">
            FPS: <span id="fps">0</span> | 
            Latência: <span id="latency">0</span>ms | 
            Frames: <span id="frameCount">0</span>
        </div>

        <div class="canvas-container">
            <canvas id="screen"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
